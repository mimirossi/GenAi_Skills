<!--
  DISCUSSION-READY CHECKLIST TEMPLATE
  ----------------------------------------------------------------------------
  HOW THE SKILL USES THIS FILE:
  When a designer asks to see a checklist (from-scratch mode), do NOT paste raw
  markdown. Instead, copy this file and fill in the CHECKLIST_DATA object below,
  then present it as an .html artifact.

  Fill in:
    - META.title    -> what's being designed (e.g. "Checkout Form")
    - META.context  -> project / platform / audience, one short line
    - SECTIONS      -> the relevant checklist section(s). Pull questions from the
                       matching files in references/checklists/. Include only the
                       questions that matter for this brief — curate, don't dump.
                       Mark the 2-4 most critical items with "star: true".

  Everything else (rendering, progress, notes, filtering, print) is automatic.

  TWO-WAY CONNECTION TO THE CHAT:
  - The chat should also WALK the designer through these questions in batches (see
    SKILL.md Step 2A) — this artifact is the shared record, not a dead-end.
  - The "Esporta risposte" button compiles every ticked / flagged / annotated item into
    a text summary the designer can paste back into chat (or download as .md), so a
    checklist filled offline can drive the proposal.

  Keep all state in memory — do not add localStorage (it fails in artifacts).
-->
<div id="app"></div>

<script>
  /* ====================== FILL THIS IN ====================== */
  const META = {
    title: "Checklist title goes here",
    context: "Project · platform · audience",
  };

  const SECTIONS = [
    {
      name: "Section name",
      items: [
        { q: "First question the team should answer?", star: true },
        { q: "Second question?" },
        { q: "Third question?" },
      ],
    },
    // ...more sections
  ];
  /* ========================================================= */

  const styles = `
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@500;600&display=swap');

    :root{
      --paper:#F4F3EE; --card:#FBFAF7; --ink:#1B1B18; --muted:#78766C;
      --line:#E2E0D8; --line-strong:#CFCCC1;
      --accent:#3B45E0; --accent-ink:#2A32B8; --accent-wash:#ECEDFB;
      --flag:#D4571F; --flag-wash:#FBEDE4;
      --done:#2F7D4F; --done-wash:#E8F3EC;
      --shadow:0 1px 2px rgba(27,27,24,.05),0 8px 24px -12px rgba(27,27,24,.18);
    }
    *{box-sizing:border-box}
    #app{
      font-family:'Inter',system-ui,sans-serif; color:var(--ink);
      background:var(--paper); line-height:1.5;
      -webkit-font-smoothing:antialiased; padding:0;
    }
    .wrap{max-width:840px; margin:0 auto; padding:40px 28px 96px}

    /* ---- Header ---- */
    .eyebrow{
      font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600;
      letter-spacing:.22em; text-transform:uppercase; color:var(--accent-ink);
    }
    h1{
      font-family:'Space Grotesk',sans-serif; font-weight:700;
      font-size:clamp(30px,5vw,46px); line-height:1.02; letter-spacing:-.02em;
      margin:12px 0 10px;
    }
    .context{color:var(--muted); font-size:15px; max-width:60ch}

    /* ---- Sticky control bar ---- */
    .bar{
      position:sticky; top:0; z-index:20; margin:26px 0 30px;
      background:rgba(244,243,238,.86); backdrop-filter:blur(8px);
      border:1px solid var(--line); border-radius:14px; padding:14px 16px;
      display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    }
    .progress{flex:1; min-width:180px}
    .progress .nums{
      font-family:'JetBrains Mono',monospace; font-size:12.5px; font-weight:600;
      color:var(--muted); display:flex; justify-content:space-between; margin-bottom:7px;
    }
    .progress .nums b{color:var(--ink)}
    .track{height:6px; background:var(--line-strong); border-radius:99px; overflow:hidden}
    .fill{height:100%; width:0; background:var(--accent); border-radius:99px; transition:width .35s cubic-bezier(.4,0,.2,1)}
    .filters{display:flex; gap:6px}
    .filters button{
      font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600;
      letter-spacing:.04em; text-transform:uppercase; cursor:pointer;
      padding:7px 11px; border-radius:8px; border:1px solid var(--line-strong);
      background:transparent; color:var(--muted); transition:all .15s;
    }
    .filters button:hover{border-color:var(--ink); color:var(--ink)}
    .filters button.on{background:var(--ink); border-color:var(--ink); color:var(--paper)}

    /* ---- Section ---- */
    .section{margin-bottom:14px}
    .section-head{
      display:flex; align-items:baseline; gap:12px; padding:18px 4px 12px;
      border-bottom:2px solid var(--ink); margin-bottom:2px;
    }
    .section-head .idx{font-family:'JetBrains Mono',monospace; font-weight:600; font-size:13px; color:var(--accent-ink)}
    .section-head h2{
      font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:20px;
      letter-spacing:-.01em; margin:0; flex:1;
    }
    .section-head .count{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted)}

    /* ---- Item ---- */
    .item{
      display:grid; grid-template-columns:26px 1fr auto; gap:12px;
      align-items:start; padding:14px 4px; border-bottom:1px solid var(--line);
      transition:opacity .2s;
    }
    .item.done .q{color:var(--muted); text-decoration:line-through; text-decoration-color:var(--line-strong)}
    .box{
      appearance:none; -webkit-appearance:none; cursor:pointer; margin-top:1px;
      width:22px; height:22px; border:2px solid var(--line-strong); border-radius:7px;
      background:var(--card); position:relative; transition:all .15s; flex:none;
    }
    .box:hover{border-color:var(--accent)}
    .box:checked{background:var(--accent); border-color:var(--accent)}
    .box:checked::after{
      content:""; position:absolute; left:6px; top:2px; width:6px; height:11px;
      border:solid #fff; border-width:0 2.5px 2.5px 0; transform:rotate(42deg);
    }
    .qwrap{min-width:0}
    .q{font-size:15.5px; display:flex; align-items:baseline; gap:8px}
    .q .n{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); flex:none}
    .star{display:inline-block; font-size:11px; color:var(--accent); font-weight:700; transform:translateY(-1px)}
    .note{
      margin-top:8px; width:100%; border:1px solid var(--line); border-radius:8px;
      background:var(--card); padding:8px 10px; font-family:'Inter',sans-serif;
      font-size:13.5px; color:var(--ink); resize:vertical; min-height:0; height:34px;
      transition:border-color .15s; display:none;
    }
    .note::placeholder{color:var(--muted)}
    .note:focus{outline:none; border-color:var(--accent)}
    .note.show{display:block}
    .actions{display:flex; gap:4px; flex:none}
    .chip{
      cursor:pointer; border:none; background:transparent; padding:4px 6px; border-radius:6px;
      font-size:15px; line-height:1; opacity:.4; transition:all .15s;
    }
    .chip:hover{opacity:.9; background:var(--line)}
    .chip.on{opacity:1}
    .item.flagged{background:var(--flag-wash); border-radius:10px; padding-left:10px; padding-right:10px}
    .item.flagged .chip.flag{opacity:1}

    /* ---- Footer ---- */
    .foot{
      margin-top:34px; padding-top:20px; border-top:1px solid var(--line);
      display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;
    }
    .legend{display:flex; gap:18px; font-size:12.5px; color:var(--muted); flex-wrap:wrap}
    .legend span{display:flex; align-items:center; gap:6px}
    .swatch{width:12px; height:12px; border-radius:4px; flex:none}
    .print-btn{
      font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600;
      letter-spacing:.06em; text-transform:uppercase; cursor:pointer;
      padding:9px 16px; border-radius:9px; border:1px solid var(--ink);
      background:var(--ink); color:var(--paper); transition:opacity .15s;
    }
    .print-btn:hover{opacity:.85}
    .foot-actions{display:flex; gap:8px; flex-wrap:wrap}
    .ghost-btn{font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; cursor:pointer; padding:9px 16px; border-radius:9px; border:1px solid var(--line-strong); background:transparent; color:var(--ink); transition:all .15s}
    .ghost-btn:hover{border-color:var(--ink); background:var(--card)}

    .modal{position:fixed; inset:0; background:rgba(27,27,24,.5); display:none; align-items:center; justify-content:center; padding:20px; z-index:100}
    .modal.show{display:flex}
    .modal-card{background:var(--paper); border:1px solid var(--line-strong); border-radius:16px; padding:22px; max-width:600px; width:100%; box-shadow:var(--shadow)}
    .modal-head{display:flex; justify-content:space-between; align-items:center; font-family:'Space Grotesk',sans-serif; font-size:18px}
    .modal-head .x{border:none; background:transparent; font-size:16px; cursor:pointer; color:var(--muted); padding:4px}
    .modal-sub{color:var(--muted); font-size:13.5px; margin:8px 0 12px}
    #export-text{width:100%; height:240px; resize:vertical; font-family:'JetBrains Mono',monospace; font-size:12px; line-height:1.5; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px}
    #export-text:focus{outline:none; border-color:var(--accent)}
    .modal-foot{display:flex; justify-content:flex-end; gap:8px; margin-top:14px}

    @media (max-width:560px){
      .wrap{padding:28px 18px 80px}
      .item{grid-template-columns:24px 1fr; }
      .actions{grid-column:2; margin-top:2px}
    }
    @media print{
      .bar,.filters,.print-btn,.chip{display:none!important}
      #app{background:#fff}
      .note{display:block!important; -webkit-print-color-adjust:exact}
      .item{break-inside:avoid}
    }
  `;

  function render(){
    const el = document.getElementById('app');
    let n = 0, total = 0;
    SECTIONS.forEach(s => s.items.forEach(() => total++));

    const sectionsHTML = SECTIONS.map((s, si) => {
      const items = s.items.map((it) => {
        n++;
        const id = 'i'+n;
        return `
          <div class="item" data-id="${id}">
            <input type="checkbox" class="box" id="${id}" onchange="toggleDone(this)">
            <div class="qwrap">
              <label class="q" for="${id}">
                <span class="n">${String(n).padStart(2,'0')}</span>
                <span class="qt">${it.q}${it.star?' <span class="star">★</span>':''}</span>
              </label>
              <textarea class="note" placeholder="Decision / note…"></textarea>
            </div>
            <div class="actions">
              <button class="chip note-btn" title="Add a note" onclick="toggleNote(this)">✎</button>
              <button class="chip flag" title="Flag for follow-up" onclick="toggleFlag(this)">⚑</button>
            </div>
          </div>`;
      }).join('');
      return `
        <section class="section" data-sec="${si}">
          <div class="section-head">
            <span class="idx">${String(si+1).padStart(2,'0')}</span>
            <h2>${s.name}</h2>
            <span class="count">${s.items.length}</span>
          </div>
          ${items}
        </section>`;
    }).join('');

    el.innerHTML = `
      <style>${styles}</style>
      <div class="wrap">
        <header>
          <div class="eyebrow">Interface Design Checklist</div>
          <h1>${META.title}</h1>
          <p class="context">${META.context}</p>
        </header>

        <div class="bar">
          <div class="progress">
            <div class="nums"><span>Addressed</span><span><b id="done-ct">0</b> / ${total}</span></div>
            <div class="track"><div class="fill" id="fill"></div></div>
          </div>
          <div class="filters">
            <button class="on" data-f="all" onclick="setFilter(this)">All</button>
            <button data-f="open" onclick="setFilter(this)">Open</button>
            <button data-f="flag" onclick="setFilter(this)">Flagged</button>
          </div>
        </div>

        ${sectionsHTML}

        <div class="foot">
          <div class="legend">
            <span><span class="swatch" style="background:var(--accent)"></span>Addressed</span>
            <span><span class="swatch" style="background:var(--flag)"></span>Needs follow-up</span>
            <span>★ Priority question</span>
          </div>
          <div class="foot-actions">
            <button class="ghost-btn" onclick="exportAnswers()">↥ Esporta risposte</button>
            <button class="print-btn" onclick="window.print()">Print / Save PDF</button>
          </div>
        </div>

        <div class="modal" id="modal">
          <div class="modal-card">
            <div class="modal-head">
              <strong>Esporta le risposte</strong>
              <button class="x" onclick="closeModal()">✕</button>
            </div>
            <p class="modal-sub">Copia questo testo e incollalo nella chat per far continuare la skill da qui, oppure scaricalo.</p>
            <textarea id="export-text" readonly></textarea>
            <div class="modal-foot">
              <button class="ghost-btn" onclick="downloadExport()">Scarica .md</button>
              <button class="print-btn" onclick="copyExport()" id="copy-btn">Copia negli appunti</button>
            </div>
          </div>
        </div>
      </div>`;
  }

  function updateProgress(){
    const done = document.querySelectorAll('.item.done').length;
    const total = document.querySelectorAll('.item').length;
    document.getElementById('done-ct').textContent = done;
    document.getElementById('fill').style.width = total ? (done/total*100)+'%' : '0';
  }
  window.toggleDone = (cb)=>{ cb.closest('.item').classList.toggle('done', cb.checked); updateProgress(); applyFilter(); };
  window.toggleNote = (b)=>{ const t=b.closest('.item').querySelector('.note'); t.classList.toggle('show'); b.classList.toggle('on'); if(t.classList.contains('show'))t.focus(); };
  window.toggleFlag = (b)=>{ b.classList.toggle('on'); b.closest('.item').classList.toggle('flagged'); applyFilter(); };

  let filter='all';
  window.setFilter=(btn)=>{ document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('on')); btn.classList.add('on'); filter=btn.dataset.f; applyFilter(); };
  function applyFilter(){
    document.querySelectorAll('.item').forEach(it=>{
      const done=it.classList.contains('done'), flagged=it.classList.contains('flagged');
      let show=true;
      if(filter==='open') show=!done;
      if(filter==='flag') show=flagged;
      it.style.display=show?'':'none';
    });
    document.querySelectorAll('.section').forEach(sec=>{
      const any=[...sec.querySelectorAll('.item')].some(i=>i.style.display!=='none');
      sec.style.display=any?'':'none';
    });
  }

  function buildExport(){
    let out = `# ${META.title} — checklist answers\n${META.context}\n`;
    document.querySelectorAll('.section').forEach(sec=>{
      const name = sec.querySelector('.section-head h2').textContent.trim();
      let block = '';
      sec.querySelectorAll('.item').forEach(it=>{
        const q = it.querySelector('.qt').textContent.replace('★','').trim();
        const done = it.classList.contains('done');
        const flagged = it.classList.contains('flagged');
        const note = it.querySelector('.note').value.trim();
        // Only export items with a state or a note
        if(done || flagged || note){
          const mark = done ? '[x]' : '[ ]';
          const flag = flagged ? ' ⚑ follow-up' : '';
          block += `- ${mark} ${q}${flag}\n`;
          if(note) block += `    → ${note}\n`;
        }
      });
      if(block) out += `\n## ${name}\n${block}`;
    });
    if(!out.includes('##')) out += `\n(No items ticked, flagged, or annotated yet.)\n`;
    return out;
  }
  window.exportAnswers = ()=>{ document.getElementById('export-text').value = buildExport(); document.getElementById('modal').classList.add('show'); };
  window.closeModal = ()=>{ document.getElementById('modal').classList.remove('show'); };
  window.copyExport = ()=>{
    const t = document.getElementById('export-text'); t.select();
    try{ navigator.clipboard.writeText(t.value); }catch(e){ document.execCommand('copy'); }
    const b=document.getElementById('copy-btn'); const o=b.textContent; b.textContent='Copiato ✓'; setTimeout(()=>b.textContent=o,1500);
  };
  window.downloadExport = ()=>{
    const blob = new Blob([buildExport()], {type:'text/markdown'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = (META.title||'checklist').toLowerCase().replace(/[^a-z0-9]+/g,'-') + '-answers.md';
    a.click();
  };

  render();
</script>
