<!--
  DESIGN ANALYSIS REPORT TEMPLATE
  ----------------------------------------------------------------------------
  HOW THE SKILL USES THIS FILE:
  When a designer asks for the report after an analysis (Step 2B), do NOT output
  markdown. Copy this file, fill in REPORT_DATA below, and present it as an .html
  artifact. It mirrors the chat findings as a scannable, severity-sorted list the
  designer (or a developer) can act on directly.

  Fill in:
    - META.title    -> what was reviewed (e.g. "Checkout — mobile")
    - META.context  -> platform / audience / what was provided (screens, link)
    - META.summary  -> one short paragraph: overall state + the top priorities
    - FINDINGS      -> one object per issue. severity is "critical" | "major" | "minor".
                       "where" points to the exact element/area. "question" is the
                       checklist question it answers badly. "fix" is the concrete proposal.
                       "visual" (optional but recommended for critical/major issues) is an
                       inline SVG string showing a schematic BEFORE -> AFTER of the change.
                       Order doesn't matter — the template sorts by severity.
    - WORKING       -> short strings: decisions that already hold up.
    - REFERENCED    -> the checklist names that were applied.

  AUTHORING THE "visual" SVG (schematic before/after — NOT a literal redraw):
    Use viewBox="0 0 560 200". Left half = current state, right half = proposed, with a
    small arrow between. Represent UI with plain rects/lines. Use these colors so it
    matches the report: neutral #CFCCC1 for existing/unchanged elements, #C23A18 to mark
    the problem on the "before", var/#2F7D4F (green) or accent #3B45E0 to mark the fix on
    the "after". Label each side with a <text> ("Before" / "After"). Keep it abstract and
    legible — 3-6 shapes per side is plenty. Example scaffold:
      <svg viewBox="0 0 560 200" xmlns="http://www.w3.org/2000/svg">
        <text x="16" y="20" font-size="11" fill="#78766C" letter-spacing="2">BEFORE</text>
        <rect x="16" y="34" width="230" height="130" rx="6" fill="none" stroke="#CFCCC1"/>
        <!-- current-state shapes; mark the problem area with stroke/fill #C23A18 -->
        <path d="M270 100 h20 m-6 -6 l6 6 l-6 6" stroke="#78766C" fill="none" stroke-width="1.5"/>
        <text x="314" y="20" font-size="11" fill="#78766C" letter-spacing="2">AFTER</text>
        <rect x="314" y="34" width="230" height="130" rx="6" fill="none" stroke="#CFCCC1"/>
        <!-- proposed-state shapes; mark the change with #2F7D4F or #3B45E0 -->
      </svg>

  Keep all state in memory — do not add localStorage (it fails in artifacts).
-->
<div id="app"></div>

<script>
  /* ====================== FILL THIS IN ====================== */
  const META = {
    title: "Design review",
    context: "Platform · audience · what was reviewed",
    summary: "One-paragraph read on the overall state and the top priorities to fix first.",
  };

  const FINDINGS = [
    { severity:"critical", issue:"Issue headline", where:"Where in the design", question:"The checklist question it fails", fix:"The concrete fix to make." },
    // ...more findings
  ];

  const WORKING = [
    "A decision that already holds up, and why.",
  ];

  const REFERENCED = ["Checklist name"];
  /* ========================================================= */

  const SEV = {
    critical:{ label:"Critical", c:"var(--crit)", w:"var(--crit-wash)", rank:0 },
    major:   { label:"Major",    c:"var(--maj)",  w:"var(--maj-wash)",  rank:1 },
    minor:   { label:"Minor",    c:"var(--min)",  w:"var(--min-wash)",  rank:2 },
  };

  const styles = `
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@500;600&display=swap');
    :root{
      --paper:#F4F3EE; --card:#FBFAF7; --ink:#1B1B18; --muted:#78766C;
      --line:#E2E0D8; --line-strong:#CFCCC1;
      --accent:#3B45E0; --accent-ink:#2A32B8;
      --crit:#C23A18; --crit-wash:#F8E7E1;
      --maj:#C77A14;  --maj-wash:#F8EFDC;
      --min:#3B45E0;  --min-wash:#ECEDFB;
      --good:#2F7D4F; --good-wash:#E7F2EB;
      --shadow:0 1px 2px rgba(27,27,24,.05),0 10px 30px -16px rgba(27,27,24,.2);
    }
    *{box-sizing:border-box}
    #app{font-family:'Inter',system-ui,sans-serif; color:var(--ink); background:var(--paper); line-height:1.5; -webkit-font-smoothing:antialiased}
    .wrap{max-width:880px; margin:0 auto; padding:40px 28px 96px}

    .eyebrow{font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; letter-spacing:.22em; text-transform:uppercase; color:var(--accent-ink)}
    h1{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(30px,5vw,46px); line-height:1.02; letter-spacing:-.02em; margin:12px 0 8px}
    .context{color:var(--muted); font-size:14px; font-family:'JetBrains Mono',monospace}
    .summary{font-size:16px; max-width:66ch; margin:18px 0 0; padding:16px 18px; background:var(--card); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:0 12px 12px 0}

    /* score strip */
    .strip{display:flex; gap:10px; margin:26px 0 8px; flex-wrap:wrap}
    .stat{flex:1; min-width:120px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px}
    .stat .num{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:32px; line-height:1}
    .stat .lbl{font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-top:6px}
    .stat.crit .num{color:var(--crit)} .stat.maj .num{color:var(--maj)} .stat.min .num{color:var(--min)} .stat.good .num{color:var(--good)}

    .section-title{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px; letter-spacing:.02em; text-transform:uppercase; color:var(--muted); margin:34px 0 14px; display:flex; align-items:center; gap:10px}
    .section-title::after{content:""; flex:1; height:1px; background:var(--line)}

    .filters{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap}
    .filters button{font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; cursor:pointer; padding:7px 12px; border-radius:8px; border:1px solid var(--line-strong); background:transparent; color:var(--muted); transition:all .15s}
    .filters button:hover{border-color:var(--ink); color:var(--ink)}
    .filters button.on{background:var(--ink); border-color:var(--ink); color:var(--paper)}

    /* finding card */
    .find{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:12px; box-shadow:var(--shadow); border-left:4px solid var(--sev)}
    .find .top{display:flex; align-items:center; gap:12px; margin-bottom:10px; flex-wrap:wrap}
    .badge{font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; padding:4px 9px; border-radius:6px; color:var(--sev); background:var(--sevw)}
    .find h3{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:18px; letter-spacing:-.01em; margin:0; flex:1; min-width:200px}
    .where{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px}
    .where::before{content:"◍"; color:var(--sev)}
    .find .q{font-size:13.5px; color:var(--muted); font-style:italic; margin:2px 0 12px; padding-left:12px; border-left:2px solid var(--line-strong)}
    .fix{display:flex; gap:9px; font-size:15px}
    .fix .k{font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--good); flex:none; padding-top:2px}

    /* before/after visual */
    .visual{margin-top:14px}
    .vcap{font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:7px}
    .vframe{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:12px}
    .vframe svg{display:block; width:100%; height:auto}
    .vframe text{font-family:'JetBrains Mono',monospace}

    /* working list */
    .good-list{display:grid; gap:8px}
    .good-item{display:flex; gap:11px; align-items:flex-start; background:var(--good-wash); border:1px solid #CFE6D6; border-radius:10px; padding:12px 15px; font-size:15px}
    .good-item .tick{color:var(--good); font-weight:700; flex:none}

    .chips{display:flex; gap:7px; flex-wrap:wrap}
    .chip{font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; color:var(--muted); background:var(--card); border:1px solid var(--line-strong); border-radius:99px; padding:6px 12px}

    .foot{margin-top:34px; padding-top:20px; border-top:1px solid var(--line); display:flex; justify-content:flex-end}
    .print-btn{font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; cursor:pointer; padding:9px 16px; border-radius:9px; border:1px solid var(--ink); background:var(--ink); color:var(--paper)}
    .print-btn:hover{opacity:.85}

    @media (max-width:560px){ .wrap{padding:28px 18px 80px} }
    @media print{ .filters,.print-btn{display:none!important} #app{background:#fff} .find{break-inside:avoid; -webkit-print-color-adjust:exact} }
  `;

  function render(){
    const counts={critical:0,major:0,minor:0};
    FINDINGS.forEach(f=>counts[f.severity]++);
    const sorted=[...FINDINGS].sort((a,b)=>SEV[a.severity].rank-SEV[b.severity].rank);

    const findHTML=sorted.map(f=>{
      const s=SEV[f.severity];
      return `<article class="find" data-sev="${f.severity}" style="--sev:${s.c};--sevw:${s.w}">
        <div class="top">
          <span class="badge">${s.label}</span>
          <h3>${f.issue}</h3>
          ${f.where?`<span class="where">${f.where}</span>`:''}
        </div>
        ${f.question?`<div class="q">Checklist: ${f.question}</div>`:''}
        <div class="fix"><span class="k">Fix</span><span>${f.fix}</span></div>
        ${f.visual?`<div class="visual"><div class="vcap">Before → After</div><div class="vframe">${f.visual}</div></div>`:''}
      </article>`;
    }).join('');

    document.getElementById('app').innerHTML=`
      <style>${styles}</style>
      <div class="wrap">
        <header>
          <div class="eyebrow">Design Analysis Report</div>
          <h1>${META.title}</h1>
          <div class="context">${META.context}</div>
          <p class="summary">${META.summary}</p>
        </header>

        <div class="strip">
          <div class="stat crit"><div class="num">${counts.critical}</div><div class="lbl">Critical</div></div>
          <div class="stat maj"><div class="num">${counts.major}</div><div class="lbl">Major</div></div>
          <div class="stat min"><div class="num">${counts.minor}</div><div class="lbl">Minor</div></div>
          <div class="stat good"><div class="num">${WORKING.length}</div><div class="lbl">Working</div></div>
        </div>

        <div class="section-title">What to fix</div>
        <div class="filters">
          <button class="on" data-f="all" onclick="setF(this)">All ${FINDINGS.length}</button>
          <button data-f="critical" onclick="setF(this)">Critical ${counts.critical}</button>
          <button data-f="major" onclick="setF(this)">Major ${counts.major}</button>
          <button data-f="minor" onclick="setF(this)">Minor ${counts.minor}</button>
        </div>
        <div id="finds">${findHTML}</div>

        ${WORKING.length?`<div class="section-title">What's working</div>
          <div class="good-list">${WORKING.map(w=>`<div class="good-item"><span class="tick">✓</span><span>${w}</span></div>`).join('')}</div>`:''}

        ${REFERENCED.length?`<div class="section-title">Checklists applied</div>
          <div class="chips">${REFERENCED.map(r=>`<span class="chip">${r}</span>`).join('')}</div>`:''}

        <div class="foot"><button class="print-btn" onclick="window.print()">Print / Save PDF</button></div>
      </div>`;
  }

  window.setF=(btn)=>{
    document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('on'));
    btn.classList.add('on');
    const f=btn.dataset.f;
    document.querySelectorAll('.find').forEach(el=>{ el.style.display=(f==='all'||el.dataset.sev===f)?'':'none'; });
  };

  render();
</script>
